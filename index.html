<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1640" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Lumen Bandicoot — une aventure de plateforme 3D complètement copiée (mal) sur Crash Bandicoot, avec Lumen le renard à l'écharpe." />
  <title>Lumen Bandicoot</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1640; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #fff7dc; font: 800 22px system-ui, sans-serif; letter-spacing: .05em; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot">LUMEN BANDICOOT…</div>
  <noscript>Ce jeu a besoin de JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
